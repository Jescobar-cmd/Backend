name: SonarCloud

on:
  push:
    branches: [main, produccion, preproduccion, desarrollo]
  pull_request:
    branches: [main, produccion, preproduccion, desarrollo]
  workflow_dispatch:

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analisis:
    name: Analisis estatico con SonarCloud
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://usuario:clave@localhost:5432/firstgig_test
      JWT_SECRET: secreto-de-pruebas-con-longitud-suficiente
      NODE_ENV: test
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente Prisma
        run: npx prisma generate

      - name: Tests con cobertura
        run: npm run test:coverage

      - name: Escaneo SonarCloud
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
