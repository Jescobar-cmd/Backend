name: SonarCloud

on:
  push:
    branches: [main, produccion, preproduccion, desarrollo]
  pull_request:
    branches: [main, produccion, preproduccion, desarrollo]
  workflow_dispatch:

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analisis:
    name: Analisis estatico con SonarCloud
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://usuario:clave@localhost:5432/firstgig_test
      JWT_SECRET: secreto-de-pruebas-con-longitud-suficiente
      NODE_ENV: test
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci --ignore-scripts

      - name: Generar cliente Prisma
        run: npm run prisma:generate

      - name: Tests con cobertura
        run: npm run test:coverage

      - name: Escaneo SonarCloud
        uses: SonarSource/sonarqube-scan-action@0303d6b62e310685c0e34d0b9cde218036885c4d # v5.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONARTOKEN }}
          SONAR_SCANNER_OPTS: >-
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.typescript.lcov.reportPaths=coverage/lcov.info
